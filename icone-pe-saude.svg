  <circle cx="270" cy="165" r="9.5" fill="#ffffff"/>
  <circle cx="286" cy="176" r="8.5" fill="#ffffff"/>
  <circle cx="298" cy="190" r="7.5" fill="#ffffff"/> <!-- Dedo Menor -->

  <!-- Alvo de Avaliação / Rastreamento Clínico Central (Sensor / Ponto de Toque) -->
