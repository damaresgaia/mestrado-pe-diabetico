  <!-- Silhueta da Pegada / Pé Diabético -->
  <!-- Calcanhar -->
  <ellipse cx="256" cy="340" rx="42" ry="52" fill="#ffffff"/>
  
  <!-- Região plantar / Arco médio e metatarso -->
  <path d="M 218 320 C 210 270, 218 220, 240 190 C 265 190, 298 210, 296 280 C 295 320, 285 335, 276 345 Z" fill="#ffffff"/>
  
